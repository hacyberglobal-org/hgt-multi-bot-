name: Production readiness checks

on:
  push:
    branches:
      - security-hardening-production-readiness
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Security regression tests
        run: npm run test:security
      - name: Production build
        run: npm run build
